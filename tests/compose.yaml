# Disposable integration environment only. No database or HTTP ports are published.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
      MARIADB_ROOT_HOST: '%'
      MARIADB_DATABASE: wordpress
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [isolated]
  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ''
      WORDPRESS_DB_NAME: wordpress
      NO_PROXY: localhost,127.0.0.1,db
    healthcheck:
      test: [CMD, php, -r, "exit(is_file('/var/www/html/wp-load.php') && @fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - wordpress-data:/var/www/html
      - ../pixora:/var/www/html/wp-content/plugins/pixora:ro
      - .:/opt/pixora-tests:ro
    networks: [isolated]
networks:
  isolated:
    internal: true
volumes:
  wordpress-data:
